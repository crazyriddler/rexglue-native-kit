# either - see error_log.md E026 for the full trace). Same fix shape as
# the block above: bail to this block's own existing "nothing to release"
# label, loc_82583A34.
[[entrypoint.midasm_hook]]
address = 0x82583A30
name = "conan_valid_code_ptr_guard"
registers = ["r3"]
jump_address_on_true = 0x82583A34

# E027: doubly-linked-list unlink in sub_824AE930 (conan_recomp.110.cpp:
# 12609-12627) writes `next->prev's forward link` unconditionally at
