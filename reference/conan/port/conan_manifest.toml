# not distinguish this from a true freeze).
#
# The real "list is empty/exhausted" exit is loc_825870F8: it's exactly
# where the surrounding code already jumps (see the `bne 0x82587450` /
# `b 0x825870f8` pair right after this same load at line ~17608-17613)
# when the freshly-loaded r31 turns out to be null. Bailing a null r31
# *before* the load to that same target makes the guard's behavior
# identical to the load having legitimately produced null - correct list
# termination instead of a spin.
[[entrypoint.midasm_hook]]
address = 0x8258748C
name = "conan_nonnull_guard"
registers = ["r31"]
jump_address_on_false = 0x825870F8

# E026: sub_825839E0's first guarded member-release block (see src/hooks.cpp
